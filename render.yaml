services:
  - type: web
    name: lastwords
    runtime: python
    plan: starter # a persistent disk requires a paid instance; the vocabulary must survive restarts
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    disk:
      name: lastwords-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: LASTWORDS_DB
        value: /var/data/lastwords.db
      - key: GEMINI_API_KEY
        sync: false # set this in the Render dashboard; without a key the piece runs in mock mode
      - key: ANTHROPIC_API_KEY
        sync: false # optional alternative provider (used only if GEMINI_API_KEY is unset)
      - key: LASTWORDS_END_THRESHOLD
        value: "100"
      - key: LASTWORDS_GLOBAL_MESSAGES_PER_MINUTE
        value: "20"
      - key: LASTWORDS_EDITION_REBIRTH_SECONDS
        value: "12"
